<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URANIUM AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0f0f13;
    color: #e4e4e7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    padding: 16px 20px;
    background: #18181b;
    border-bottom: 1px solid #27272a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #22c55e, #06b6d4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }

  .header h1 { font-size: 18px; font-weight: 600; }
  .header span { font-size: 13px; color: #a1a1aa; }

  .status {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
    background: #27272a;
  }

  .status.ready { background: #14532d; color: #4ade80; }
  .status.loading { background: #422006; color: #fbbf24; }

  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user {
    align-self: flex-end;
    background: #8b5cf6;
    color: white;
    border-bottom-right-radius: 5px;
  }

  .bot {
    align-self: flex-start;
    background: #27272a;
    border-bottom-left-radius: 5px;
  }

  .progress-box {
    align-self: center;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 16px;
    padding: 20px 28px;
    text-align: center;
    max-width: 420px;
    width: 100%;
  }

  .progress-bar {
    height: 8px;
    background: #27272a;
    border-radius: 4px;
    margin: 12px 0;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #06b6d4);
    width: 0%;
    transition: width 0.3s;
  }

  .input-area {
    padding: 16px 20px;
    background: #18181b;
    border-top: 1px solid #27272a;
    display: flex;
    gap: 12px;
  }

  #userInput {
    flex: 1;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 14px;
    padding: 14px 16px;
    color: white;
    font-size: 15px;
    outline: none;
  }

  #userInput:focus { border-color: #8b5cf6; }
  #userInput:disabled { opacity: 0.5; }

  #sendBtn {
    background: #8b5cf6;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 0 24px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  #sendBtn:hover:not(:disabled) { background: #7c3aed; }
  #sendBtn:disabled { background: #3f3f46; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="header">
    <div class="left">
      <div class="logo">AI</div>
      <div>
        <h1>URANIUM AI</h1>
        <span>Runs 100% on your device • Private</span>
      </div>
    </div>
    <div class="status loading" id="status">Loading...</div>
  </div>

  <div class="chat-container" id="chat">
    <div class="progress-box" id="progressBox">
      <div id="progressText">Initializing WebGPU engine...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div style="font-size:13px;color:#a1a1aa;margin-top:8px">
        First load downloads the model (~0.5–2 GB). After that it stays cached and works offline.
      </div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Waiting for model..." disabled autocomplete="off">
    <button id="sendBtn" disabled>Send</button>
  </div>

<script type="module">
  import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const progressBox = document.getElementById('progressBox');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');

  // Good balance of quality + speed for most devices
  // Smaller options: "SmolLM2-360M-Instruct-q4f16_1-MLC"
  // Bigger/smarter: "Phi-3.5-mini-instruct-q4f16_1-MLC"
  const SELECTED_MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

  let engine = null;
  let messages = [
    { role: "system", content: "You are a helpful, friendly AI assistant running locally in the user's browser." }
  ];

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'bot'}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function init() {
    try {
      engine = await CreateMLCEngine(SELECTED_MODEL, {
        initProgressCallback: (report) => {
          progressText.textContent = report.text;
          if (report.progress) {
            progressFill.style.width = Math.round(report.progress * 100) + "%";
          }
        }
      });

      // Ready!
      progressBox.remove();
      statusEl.textContent = "Ready • Local";
      statusEl.className = "status ready";

      addMessage("Model loaded! I'm running completely on your device using WebGPU. Ask me anything.", false);

      input.disabled = false;
      sendBtn.disabled = false;
      input.placeholder = "Ask me anything...";
      input.focus();

    } catch (err) {
      console.error(err);
      progressText.textContent = "Failed to load. Make sure your browser supports WebGPU (Chrome/Edge recommended).";
      statusEl.textContent = "Error";
      statusEl.className = "status";
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !engine) return;

    addMessage(text, true);
    input.value = "";
    sendBtn.disabled = true;
    input.disabled = true;

    messages.push({ role: "user", content: text });

    // Create empty bot message for streaming
    const botMsg = addMessage("", false);

    try {
      const stream = await engine.chat.completions.create({
        messages,
        stream: true,
        temperature: 0.7,
      });

      let fullReply = "";
      for await (const chunk of stream) {
        const token = chunk.choices[0]?.delta?.content || "";
        fullReply += token;
        botMsg.textContent = fullReply;
        chat.scrollTop = chat.scrollHeight;
      }

      messages.push({ role: "assistant", content: fullReply });

    } catch (err) {
      console.error(err);
      botMsg.textContent = "Error generating response. Try again.";
    }

    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // Start loading
  init();
</script>
</body>
</html>
