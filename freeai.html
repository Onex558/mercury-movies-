<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0f0f13;
    color: #e4e4e7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    padding: 16px 20px;
    background: #18181b;
    border-bottom: 1px solid #27272a;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
  }

  .header span {
    font-size: 13px;
    color: #a1a1aa;
  }

  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 15px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user {
    align-self: flex-end;
    background: #8b5cf6;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .bot {
    align-self: flex-start;
    background: #27272a;
    border-bottom-left-radius: 4px;
  }

  .typing {
    align-self: flex-start;
    background: #27272a;
    padding: 12px 18px;
    border-radius: 18px;
    display: none;
  }

  .typing span {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #a1a1aa;
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  .input-area {
    padding: 16px 20px;
    background: #18181b;
    border-top: 1px solid #27272a;
    display: flex;
    gap: 12px;
  }

  #userInput {
    flex: 1;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 12px;
    padding: 14px 16px;
    color: white;
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }

  #userInput:focus {
    border-color: #8b5cf6;
  }

  #sendBtn {
    background: #8b5cf6;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 0 22px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  #sendBtn:hover {
    background: #7c3aed;
  }

  #sendBtn:disabled {
    background: #3f3f46;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">AI</div>
    <div>
      <h1>Free AI</h1>
      <span>100% free • No API • Runs offline</span>
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="message bot">
      Hey! I'm Free AI — a simple chatbot that runs entirely in your browser.  
      Ask me anything (I know a bit about coding, jokes, advice, and general knowledge). What's on your mind?
    </div>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');

  // Simple knowledge + personality
  const responses = {
    greetings: [
      "Hey there! How can I help you today?",
      "Hi! What's up?",
      "Hello! Ready when you are.",
      "Yo! What do you need?"
    ],
    howAreYou: [
      "I'm just a bunch of JavaScript, but I'm doing great! How about you?",
      "Feeling electric today. You?",
      "Pretty good for an offline AI. How are you holding up?"
    ],
    name: [
      "I'm Free AI — built just for you in a single HTML file.",
      "You can call me Free AI. Nice to meet you!"
    ],
    joke: [
      "Why do programmers prefer dark mode? Because light attracts bugs!",
      "Why did the AI go to therapy? It had too many neural issues.",
      "I told my computer I needed a break... now it won't stop sending me KitKat ads."
    ],
    help: [
      "I can chat, tell jokes, give basic advice, explain simple coding concepts, or just keep you company. What do you need?",
      "Try asking me for a joke, coding help, motivation, or just say hi!"
    ],
    bye: [
      "See you later! Come back anytime.",
      "Bye! It was nice chatting.",
      "Catch you later!"
    ],
    default: [
      "Interesting... tell me more.",
      "Hmm, I'm still learning. Can you rephrase that?",
      "That's a good one. What else is on your mind?",
      "I'm a simple offline AI, so I might not know everything, but I'm listening!",
      "Got it. Anything else you'd like to talk about?"
    ]
  };

  function getReply(text) {
    const msg = text.toLowerCase().trim();

    if (/^(hi|hello|hey|yo|sup|hiya)\b/.test(msg)) return random(responses.greetings);
    if (/how are you|how's it going|how do you feel/.test(msg)) return random(responses.howAreYou);
    if (/what('?s| is) your name|who are you/.test(msg)) return random(responses.name);
    if (/joke|funny|make me laugh/.test(msg)) return random(responses.joke);
    if (/help|what can you do|commands/.test(msg)) return random(responses.help);
    if (/bye|goodbye|see you|cya|exit/.test(msg)) return random(responses.bye);
    if (/thank|thanks|thx/.test(msg)) return "You're welcome! Happy to help.";
    if (/love you|i like you/.test(msg)) return "Aww that's sweet! I'm just code, but I appreciate it.";
    if (/weather|time|date/.test(msg)) return "I don't have live data (I'm fully offline), but you can check your phone for that!";
    if (/code|programming|javascript|html|python/.test(msg)) return "I can talk about coding! What language or problem are you working on?";
    if (/motivat|inspire|sad|depressed|lonely/.test(msg)) return "Hey, you're stronger than you think. One step at a time. Want to talk about it?";
    
    return random(responses.default);
  }

  function random(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'bot'}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping(show) {
    typing.style.display = show ? 'block' : 'none';
    if (show) chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, true);
    input.value = '';
    sendBtn.disabled = true;
    showTyping(true);

    // Fake thinking delay
    setTimeout(() => {
      showTyping(false);
      const reply = getReply(text);
      addMessage(reply, false);
      sendBtn.disabled = false;
      input.focus();
    }, 600 + Math.random() * 800);
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  input.focus();
</script>
</body>
</html>
