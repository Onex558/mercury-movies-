<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f13; color: #e4e4e7; height: 100vh; display: flex; flex-direction: column; margin: 0; }
  .header { padding: 16px 20px; background: #18181b; border-bottom: 1px solid #27272a; }
  .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; }
  .user { align-self: flex-end; background: #8b5cf6; color: white; }
  .bot { align-self: flex-start; background: #27272a; }
  .input-area { padding: 16px 20px; background: #18181b; border-top: 1px solid #27272a; display: flex; gap: 10px; }
  input { flex: 1; background: #27272a; border: 1px solid #3f3f46; border-radius: 12px; padding: 12px 14px; color: white; font-size: 15px; outline: none; }
  button { background: #8b5cf6; color: white; border: none; border-radius: 12px; padding: 0 20px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #3f3f46; }
</style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0;font-size:18px;">Free AI Test</h1>
    <div style="font-size:13px;color:#a1a1aa;">Using studytoolsss.b-cdn.net</div>
  </div>

  <div class="chat" id="chat">
    <div class="msg bot">Send a message to test the new endpoint.</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = `msg ${isUser ? 'user' : 'bot'}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, true);
    input.value = '';
    sendBtn.disabled = true;

    try {
      const response = await fetch("https://studytoolsss.b-cdn.net/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: [
            { role: "system", content: "You are a helpful assistant." },
            { role: "user", content: text }
          ]
        })
      });

      const raw = await response.text();
      console.log("Status:", response.status);
      console.log("Raw response:", raw);

      if (!response.ok) {
        addMessage(`Error ${response.status}: ${raw.substring(0, 200)}`, false);
        return;
      }

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        addMessage("Got non-JSON response: " + raw.substring(0, 300), false);
        return;
      }

      const reply = data.response?.choices?.[0]?.message?.content 
                 || data.choices?.[0]?.message?.content 
                 || data.response 
                 || data.message
                 || JSON.stringify(data).substring(0, 400);

      addMessage(reply || "Empty reply", false);

    } catch (err) {
      console.error(err);
      addMessage("Network error: " + err.message, false);
    }

    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });
  input.focus();
</script>
</body>
</html>
