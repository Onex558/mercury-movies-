<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI – DeepSeek</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f13;
    color: #e4e4e7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    padding: 16px 20px;
    background: #18181b;
    border-bottom: 1px solid #27272a;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header span { font-size: 13px; color: #a1a1aa; }
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #8b5cf6;
    color: white;
    border-bottom-right-radius: 5px;
  }
  .bot {
    align-self: flex-start;
    background: #27272a;
    border-bottom-left-radius: 5px;
  }
  .typing {
    align-self: flex-start;
    background: #27272a;
    padding: 14px 20px;
    border-radius: 18px;
    display: none;
  }
  .typing span {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #a1a1aa;
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.3s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
  .input-area {
    padding: 16px 20px;
    background: #18181b;
    border-top: 1px solid #27272a;
    display: flex;
    gap: 12px;
  }
  #userInput {
    flex: 1;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 14px;
    padding: 14px 16px;
    color: white;
    font-size: 15px;
    outline: none;
  }
  #userInput:focus { border-color: #8b5cf6; }
  #sendBtn {
    background: #8b5cf6;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 0 24px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled {
    background: #3f3f46;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">AI</div>
    <div>
      <h1>Free AI</h1>
      <span>DeepSeek via uranium</span>
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="message bot">
      Ready. Using: POST /v1/chat/deepseek
    </div>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');

  let messages = [
    { role: "system", content: "You are a helpful and clear AI assistant." }
  ];

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'bot'}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping(show) {
    typing.style.display = show ? 'block' : 'none';
    if (show) chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
  }

  async function askAI(userText) {
    messages.push({ role: "user", content: userText });

    try {
      const response = await fetch("https://studytoolsss.b-cdn.net/v1/chat/gpt-oss", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`Error ${response.status}: ${errorText.substring(0, 150)}`);
      }

      const data = await response.json();
      const reply = data.response?.choices?.[0]?.message?.content 
                 || data.choices?.[0]?.message?.content 
                 || data.response 
                 || data.message
                 || "No reply received.";

      messages.push({ role: "assistant", content: reply });
      return reply;

    } catch (err) {
      console.error(err);
      return "⚠️ " + err.message;
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, true);
    input.value = '';
    sendBtn.disabled = true;
    showTyping(true);

    const reply = await askAI(text);

    showTyping(false);
    addMessage(reply, false);
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });

  input.focus();
</script>
</body>
</html>
