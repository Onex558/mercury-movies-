<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#07070f;--surface:#0f0f1c;--surface2:#16162a;--surface3:#1e1e38;
  --accent:#e8c84a;--accent2:#c8402a;--accent3:#5b8dee;--accent4:#9333ea;
  --text:#eae8f5;--muted:#6a6880;--border:#22223a;
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100%;overflow-x:hidden;}

.disclaimer-bar{
  width:100%;background:rgba(200,64,42,0.12);border-bottom:1px solid rgba(200,64,42,0.35);
  padding:8px 20px;font-size:.72rem;color:rgba(255,255,255,0.6);
  text-align:center;letter-spacing:.3px;line-height:1.5;
}
.disclaimer-bar strong{color:rgba(255,255,255,0.85);}
.disclaimer-bar a{color:var(--accent);text-decoration:none;font-weight:600;}
.disclaimer-bar a:hover{text-decoration:underline;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* HEADER */
.site-header{
  position:sticky;top:0;z-index:200;
  background:rgba(7,7,15,0.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.logo{
  font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  flex-shrink:0;
}
.logo-plus{color:var(--accent3);-webkit-text-fill-color:var(--accent3);}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;}
.tab{
  padding:5px 14px;border-radius:16px;font-size:.75rem;font-weight:600;letter-spacing:.5px;
  cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);
  transition:all .2s;white-space:nowrap;
}
.tab.active{background:var(--accent);color:#07070f;border-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);border-color:var(--muted);}
.search-bar{
  width:100%;max-width:320px;padding:8px 14px;border-radius:18px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-size:.83rem;outline:none;transition:border-color .2s;
}
.search-bar:focus{border-color:var(--accent3);}
.search-bar::placeholder{color:var(--muted);}

/* LAYOUT */
.site{max-width:1100px;margin:0 auto;padding:24px 16px 100px;}
.page{display:none;}
.page.active{display:block;}

/* SECTION */
.section{margin-bottom:36px;}
.section-header{
  font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:3px;
  color:var(--accent2);border-bottom:2px solid var(--accent2);
  padding-bottom:5px;margin-bottom:12px;
}

/* MOVIE GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:all .2s;position:relative;
}
.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 28px rgba(232,200,74,.13);}
.card-thumb{
  width:100%;aspect-ratio:2/3;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;
  position:relative;overflow:hidden;
}
.card-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(7,7,15,.9) 0%,transparent 55%);}
.card-play{
  position:absolute;bottom:7px;right:7px;z-index:2;
  width:28px;height:28px;border-radius:50%;background:var(--accent2);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.card-play svg{width:11px;height:11px;fill:white;margin-left:2px;}
.card:hover .card-play{opacity:1;}
.card-info{padding:7px 9px;}
.card-title{font-size:.68rem;font-weight:600;color:var(--text);line-height:1.3;}

/* LIST ITEMS */
.list-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:7px;margin-bottom:6px;cursor:pointer;transition:all .15s;text-decoration:none;
}
.list-item:hover{border-color:var(--accent);background:var(--surface2);}
.list-name{font-size:.86rem;color:var(--text);flex:1;}
.list-arrow{color:var(--muted);}
.play-dot{width:24px;height:24px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.play-dot svg{width:10px;height:10px;fill:white;margin-left:2px;}
.manga-dot{background:var(--accent4);}
.music-dot{background:var(--accent3);}

/* ARTIST GRID */
.artist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:24px;}
.artist-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;text-decoration:none;display:block;transition:all .2s;cursor:pointer;
}
.artist-card:hover{border-color:var(--accent3);transform:translateY(-3px);}
.artist-avatar{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:2.8rem;background:var(--surface2);}
.artist-name{padding:8px 10px;font-size:.75rem;font-weight:600;color:var(--text);text-align:center;}

/* SECTION LABEL */
.sec-label{
  font-family:'Bebas Neue',sans-serif;font-size:.9rem;letter-spacing:4px;
  color:var(--accent3);margin:1.5rem 0 .8rem;display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* PLAYER MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(4,4,12,.97);align-items:center;justify-content:center;padding:14px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:820px;overflow:hidden;
  box-shadow:0 0 60px rgba(200,64,42,.25);
  animation:modalIn .25s cubic-bezier(.16,1,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
.modal-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface2);
}
.modal-title{font-size:.9rem;font-weight:600;letter-spacing:.5px;max-width:60%;}
.modal-btns{display:flex;gap:8px;}
.mbtn{
  padding:5px 12px;border-radius:7px;font-size:.68rem;font-weight:700;letter-spacing:.5px;
  cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s;
}
.mbtn-fs{background:var(--accent);color:#07070f;}
.mbtn-fs:hover{background:#f5d55a;}
.mbtn-close{background:var(--surface3);color:var(--muted);}
.mbtn-close:hover{color:var(--text);}
.modal-player{position:relative;width:100%;padding-top:56.25%;background:#000;}
.modal-player iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}

/* FULLSCREEN */
.fs-overlay{display:none;position:fixed;inset:0;z-index:2000;background:#000;flex-direction:column;}
.fs-overlay.open{display:flex;}
.fs-bar{
  position:absolute;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);
  opacity:0;transition:opacity .3s;
}
.fs-overlay:hover .fs-bar{opacity:1;}
.fs-title{font-size:.88rem;font-weight:600;color:#fff;}
.fs-x{
  padding:5px 12px;border-radius:7px;background:rgba(200,64,42,.8);
  color:#fff;font-size:.68rem;font-weight:700;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;
}
.fs-iframe{flex:1;border:none;width:100%;height:100%;}

/* ALPHA NAV */
.alpha-nav{display:flex;flex-wrap:wrap;gap:4px;padding:.7rem 0;border-bottom:1px solid var(--border);margin-bottom:.5rem;}
.alpha-nav a{font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:1px;color:var(--muted);padding:2px 6px;border-radius:4px;cursor:pointer;transition:all .15s;}
.alpha-nav a:hover{background:var(--surface2);color:var(--accent);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:.9rem;}
</style>
</head>

</div>

<!-- MODAL PLAYER -->
<div class="modal-overlay" id="modal" onclick="closeModalBg(event)">

        <button class="mbtn mbtn-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-player">
      <iframe id="modal-iframe" allowfullscreen allow="autoplay;fullscreen"></iframe>
    </div>
  </div>
</div>

<!-- FULLSCREEN -->
<div class="fs-overlay" id="fs-overlay">
  <div class="fs-bar">
    <span class="fs-title" id="fs-title"></span>
    <button class="fs-x" onclick="closeFS()">✕ Exit</button>
  </div>
  <iframe class="fs-iframe" id="fs-iframe" allowfullscreen allow="autoplay;fullscreen"></iframe>
</div>

// ── HELPERS ──
function toPreview(url){
  if(url.includes('drive.google.com/file')){
    const m=url.match(/\/d\/([^\/\?]+)/);
    return m?`https://drive.google.com/file/d/${m[1]}/preview`:url;
  }
  return url;
}
function svgPlay(){return`<svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12" fill="white"/></svg>`;}

// ── BUILD MOVIES ──
function buildMovies(list){
  const letters=list?[...new Set(list.map(m=>m._letter))]:Object.keys(movies);
  if(!list){
    // build alpha nav
    document.getElementById('movie-alpha').innerHTML=Object.keys(movies).map(l=>`<a onclick="scrollTo2('mv-${l}')">${l}</a>`).join('');
    let html='';
    for(const l of Object.keys(movies)){
      html+=`<div class="section" id="mv-${l}"><div class="section-header">${l}</div><div class="grid">`;
      movies[l].forEach(m=>html+=movieCard(m));
      html+=`</div></div>`;
    }
    document.getElementById('movies-container').innerHTML=html;
    document.getElementById('movies-results').style.display='none';
    document.getElementById('movies-container').style.display='';
  } else {
    let html='<div class="grid">'+list.map(m=>movieCard(m)).join('')+'</div>';
    document.getElementById('movies-results').innerHTML=html||'<div class="empty">No results found.</div>';
    document.getElementById('movies-results').style.display='';
    document.getElementById('movies-container').style.display='none';
  }
}
function movieCard(m){
  const idx=JSON.stringify(m);
  return`<div class="card" onclick='openMovie(${JSON.stringify(m)})'>
    <div class="card-thumb">${m.e}<div class="card-play">${svgPlay()}</div></div>
    <div class="card-info"><div class="card-title">${m.t}</div></div>
  </div>`;
}

  const container=document.getElementById('tv-container');
  const results=document.getElementById('tv-results');
  if(!list){
    let html='';
    for(const l of Object.keys(tvShows)){
      html+=`<div class="section"><div class="section-header">${l}</div>`;
      tvShows[l].forEach(s=>html+=`<a class="list-item" href="${s.l}" target="_blank"><div class="play-dot">${svgPlay()}</div><span class="list-name">${s.t}</span><span class="list-arrow">›</span></a>`);
      html+=`</div>`;
    }
    container.innerHTML=html;results.style.display='none';container.style.display='';
  } else {
    results.innerHTML=list.map(s=>`<a class="list-item" href="${s.l}" target="_blank"><div class="play-dot">${svgPlay()}</div><span class="list-name">${s.t}</span><span class="list-arrow">›</span></a>`).join('')||'<div class="empty">No results.</div>';
    results.style.display='';container.style.display='none';
  }
}

// ── BUILD ANIME ──
function buildAnime(list){
  const container=document.getElementById('anime-container');
  const results=document.getElementById('anime-results');
  const data=list||animeShows;
  let html='';
  data.forEach(a=>{
    html+=`<div class="section"><div class="section-header">${a.emoji||'⛩️'} ${a.t}</div>`;
    if(a.link) html+=`<a class="list-item" href="${a.link}" target="_blank"><div class="play-dot">${svgPlay()}</div><span class="list-name">Watch / Open</span><span class="list-arrow">›</span></a>`;
    else if(a.episodes){
      html+=`<div class="grid">`;
      a.episodes.forEach(ep=>html+=`<a class="card" href="${ep.l}" target="_blank"><div class="card-thumb" style="font-size:1.3rem;font-weight:700;color:var(--accent)">EP ${ep.ep}</div><div class="card-info"><div class="card-title">Episode ${ep.ep}</div></div></a>`);
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  if(list){results.innerHTML=html||'<div class="empty">No results.</div>';results.style.display='';container.style.display='none';}
  else{container.innerHTML=html;results.style.display='none';container.style.display='';}
}

// ── BUILD MANGA ──
function buildManga(list){
  const container=document.getElementById('manga-container');
  const results=document.getElementById('manga-results');
  if(!list){
    let html='';
    mangaSections.forEach(sec=>{
      html+=`<div class="section"><div class="section-header">${sec.emoji} ${sec.title}</div>`;
      sec.items.forEach(item=>html+=`<a class="list-item" href="${item.l}" target="_blank"><div class="play-dot manga-dot">📖</div><span class="list-name">${item.t}</span><span class="list-arrow">›</span></a>`);
      html+=`</div>`;
    });
    container.innerHTML=html;results.style.display='none';container.style.display='';
  } else {
    results.innerHTML=list.map(item=>`<a class="list-item" href="${item.l}" target="_blank"><div class="play-dot manga-dot">📖</div><span class="list-name">${item.t}</span><span class="list-arrow">›</span></a>`).join('')||'<div class="empty">No results.</div>';
    results.style.display='';container.style.display='none';
  }
}

// ── BUILD MUSIC ──
function buildMusic(){
  document.getElementById('artist-grid').innerHTML=artists.map(a=>`<a class="artist-card" href="${a.l}" target="_blank"><div class="artist-avatar">${a.e}</div><div class="artist-name">${a.n}</div></a>`).join('');
  let html='';
  for(const l of Object.keys(albums)){
    html+=`<div class="section"><div class="section-header">${l}</div>`;
    albums[l].forEach(a=>html+=`<a class="list-item" href="${a.l}" target="_blank"><div class="play-dot music-dot">💿</div><span class="list-name">${a.t}</span><span class="list-arrow">›</span></a>`);
    html+=`</div>`;
  }
  document.getElementById('albums-container').innerHTML=html;
}

// ── PLAYER ──
function openMovie(m){
  if(typeof m==='string') m=JSON.parse(m);
  currentMovie=m;
  document.getElementById('modal-title').textContent=m.t;
  document.getElementById('modal-iframe').src=toPreview(m.l);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modal-iframe').src='';document.body.style.overflow='';}
function closeModalBg(e){if(e.target===document.getElementById('modal'))closeModal();}
function openFS(){
  if(!currentMovie)return;
  document.getElementById('fs-title').textContent=currentMovie.t;
  document.getElementById('fs-iframe').src=toPreview(currentMovie.l);
  document.getElementById('fs-overlay').classList.add('open');
  closeModal();
}
function closeFS(){document.getElementById('fs-overlay').classList.remove('open');document.getElementById('fs-iframe').src='';}

// ── SEARCH ──
function handleSearch(){
  const v=document.getElementById('search').value.toLowerCase().trim();
  const tab=document.querySelector('.tab.active').textContent;
  if(tab.includes('Movie')){
    if(!v){buildMovies();return;}
    const res=[];Object.entries(movies).forEach(([l,arr])=>arr.forEach(m=>{if(m.t.toLowerCase().includes(v))res.push(m);}));
    buildMovies(res);
  } else if(tab.includes('TV')){
    if(!v){buildTV();return;}
    const res=[];Object.values(tvShows).forEach(arr=>arr.forEach(s=>{if(s.t.toLowerCase().includes(v))res.push(s);}));
    buildTV(res);
  } else if(tab.includes('Anime')){
    if(!v){buildAnime();return;}
    buildAnime(animeShows.filter(a=>a.t.toLowerCase().includes(v)));
  } else if(tab.includes('Manga')){
    if(!v){buildManga();return;}
    const res=[];mangaSections.forEach(sec=>sec.items.forEach(item=>{if(item.t.toLowerCase().includes(v))res.push(item);}));
    buildManga(res);
  }
}

// ── TABS ──
function switchTab(tab,e){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(tab+'-page').classList.add('active');
  document.getElementById('search').value='';
  if(tab==='movies')buildMovies();
  else if(tab==='tv')buildTV();
  else if(tab==='anime')buildAnime();
  else if(tab==='manga')buildManga();
}
function scrollTo2(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('fs-overlay').classList.contains('open'))closeFS();else closeModal();}});

// ── INIT ──
buildMovies();buildTV();buildAnime();buildManga();buildMusic();
</script>
