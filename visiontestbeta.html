<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI – Vision</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f13;
    color: #e4e4e7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    padding: 16px 20px;
    background: #18181b;
    border-bottom: 1px solid #27272a;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header span { font-size: 13px; color: #a1a1aa; }
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #8b5cf6;
    color: white;
    border-bottom-right-radius: 5px;
  }
  .bot {
    align-self: flex-start;
    background: #27272a;
    border-bottom-left-radius: 5px;
  }
  .message img {
    max-width: 220px;
    border-radius: 12px;
    margin-top: 8px;
    display: block;
  }
  .typing {
    align-self: flex-start;
    background: #27272a;
    padding: 14px 20px;
    border-radius: 18px;
    display: none;
  }
  .typing span {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #a1a1aa;
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.3s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
  .input-area {
    padding: 14px 18px;
    background: #18181b;
    border-top: 1px solid #27272a;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .preview {
    display: none;
    align-items: center;
    gap: 10px;
  }
  .preview img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
  }
  .preview button {
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #userInput {
    flex: 1;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 12px;
    padding: 12px 14px;
    color: white;
    font-size: 15px;
    outline: none;
  }
  #userInput:focus { border-color: #8b5cf6; }
  #fileInput { display: none; }
  .icon-btn {
    background: #27272a;
    border: 1px solid #3f3f46;
    color: white;
    border-radius: 12px;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
  }
  #sendBtn {
    background: #8b5cf6;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 0 22px;
    font-weight: 600;
    cursor: pointer;
    height: 46px;
  }
  #sendBtn:disabled {
    background: #3f3f46;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">AI</div>
    <div>
      <h1>Free AI + Vision</h1>
      <span>Upload image + ask questions</span>
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="message bot">
      You can now upload an image and ask me what’s in it or any question about the picture.
    </div>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>

  <div class="input-area">
    <div class="preview" id="preview">
      <img id="previewImg" src="" alt="preview">
      <button id="removeImg">Remove</button>
    </div>
    <div class="controls">
      <label class="icon-btn" for="fileInput" title="Upload image">📷</label>
      <input type="file" id="fileInput" accept="image/*">
      <input type="text" id="userInput" placeholder="Ask about the image or type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const removeImg = document.getElementById('removeImg');

  let messages = [
    { role: "system", content: "You are a helpful AI that can see and describe images." }
  ];
  let currentImageBase64 = null;

  function addMessage(text, isUser, imageSrc = null) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'bot'}`;
    
    if (imageSrc) {
      const img = document.createElement('img');
      img.src = imageSrc;
      div.appendChild(img);
    }
    
    if (text) {
      const textNode = document.createElement('div');
      textNode.textContent = text;
      div.appendChild(textNode);
    }
    
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping(show) {
    typing.style.display = show ? 'block' : 'none';
    if (show) chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
  }

  // Handle image selection
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      currentImageBase64 = event.target.result;
      previewImg.src = currentImageBase64;
      preview.style.display = 'flex';
    };
    reader.readAsDataURL(file);
  });

  removeImg.addEventListener('click', () => {
    currentImageBase64 = null;
    preview.style.display = 'none';
    fileInput.value = '';
  });

  async function askAI(userText) {
    // Build the user message
    let userContent;

    if (currentImageBase64) {
      // Vision format
      userContent = [
        { type: "text", text: userText || "What do you see in this image? Describe it in detail." },
        { 
          type: "image_url", 
          image_url: { url: currentImageBase64 } 
        }
      ];
    } else {
      userContent = userText;
    }

    messages.push({ role: "user", content: userContent });

    try {
      const response = await fetch("https://studytoolsss.b-cdn.net/v1/chat/deepseek", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`Error ${response.status}: ${errorText.substring(0, 150)}`);
      }

      const data = await response.json();
      const reply = data.response?.choices?.[0]?.message?.content 
                 || data.choices?.[0]?.message?.content 
                 || data.response 
                 || data.message
                 || "No reply received.";

      messages.push({ role: "assistant", content: reply });
      return reply;

    } catch (err) {
      console.error(err);
      return "⚠️ " + err.message;
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text && !currentImageBase64) return;

    // Show user message + image in chat
    addMessage(text || "📷 Image uploaded", true, currentImageBase64);

    // Clear input
    const imageToSend = currentImageBase64;
    input.value = '';
    currentImageBase64 = null;
    preview.style.display = 'none';
    fileInput.value = '';

    sendBtn.disabled = true;
    showTyping(true);

    const reply = await askAI(text);

    showTyping(false);
    addMessage(reply, false);
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });

  input.focus();
</script>
</body>
</html>
