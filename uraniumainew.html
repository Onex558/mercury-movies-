<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>☢ Uranium AI</title>

<style>
:root {
  --green: #00ff88;
  --bg: #080b09;
  --panel: #101512;
  --panel-light: #171d19;
  --border: #26332a;
  --text: #e8f5ec;
  --muted: #8b9b90;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 260px;
  background: #0c100d;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-bottom: 15px;
}

.logo {
  width: 42px;
  height: 42px;
  background: var(--green);
  color: #000;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 24px;
  box-shadow: 0 0 20px rgba(0,255,136,.25);
}

.brand h1 {
  font-size: 18px;
}

.brand span {
  font-size: 11px;
  color: var(--muted);
}

.new-chat {
  width: 100%;
  padding: 12px;
  background: var(--green);
  color: #000;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 15px;
}

.history-title {
  font-size: 11px;
  color: var(--muted);
  margin: 10px 8px;
  text-transform: uppercase;
}

.history {
  overflow-y: auto;
  flex: 1;
}

.history-item {
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  color: #c8d4cc;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-item:hover {
  background: var(--panel-light);
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 65px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 10px;
}

.topbar h2 {
  font-size: 16px;
}

.status {
  color: var(--green);
  font-size: 12px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px 10%;
  scroll-behavior: smooth;
}

.message-row {
  display: flex;
  gap: 12px;
  margin-bottom: 22px;
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 16px;
}

.user-avatar {
  background: #303632;
}

.ai-avatar {
  background: var(--green);
  color: black;
}

.message-content {
  line-height: 1.6;
  font-size: 15px;
  max-width: 800px;
  white-space: pre-wrap;
  word-break: break-word;
}

.message-name {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
}

.welcome {
  max-width: 700px;
  margin: 10vh auto;
  text-align: center;
}

.welcome-logo {
  width: 80px;
  height: 80px;
  margin: auto auto 20px;
  background: var(--green);
  color: black;
  border-radius: 22px;
  display: grid;
  place-items: center;
  font-size: 42px;
  box-shadow: 0 0 40px rgba(0,255,136,.25);
}

.welcome h2 {
  font-size: 30px;
  margin-bottom: 10px;
}

.welcome p {
  color: var(--muted);
}

.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 30px;
}

.suggestion {
  text-align: left;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  font-size: 13px;
}

.suggestion:hover {
  border-color: var(--green);
}

.input-section {
  padding: 15px 10% 25px;
}

.input-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 8px;
}

.input-box:focus-within {
  border-color: var(--green);
  box-shadow: 0 0 0 2px rgba(0,255,136,.08);
}

textarea {
  width: 100%;
  min-height: 55px;
  max-height: 180px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  padding: 10px;
  font: inherit;
}

.input-controls {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.send {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 12px;
  background: var(--green);
  color: black;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.send:disabled {
  background: #29332d;
  color: #657069;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  font-size: 10px;
  color: #59635c;
  margin-top: 8px;
}

.typing {
  display: flex;
  gap: 5px;
  padding: 10px 0;
}

.typing span {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  animation: bounce 1.3s infinite;
}

.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }

@keyframes bounce {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .3;
  }
  30% {
    transform: translateY(-6px);
    opacity: 1;
  }
}

@media(max-width: 700px) {
  .sidebar {
    display: none;
  }

  .chat {
    padding: 20px;
  }

  .input-section {
    padding-left: 15px;
    padding-right: 15px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      <div class="logo">☢</div>
      <div>
        <h1>Uranium AI</h1>
        <span>Powered by AI</span>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      + New Chat
    </button>

    <div class="history-title">Recent Chats</div>
    <div class="history" id="history"></div>

  </aside>

  <main class="main">

    <div class="topbar">
      <h2>☢ Uranium AI</h2>
      <span class="status">● Online</span>
    </div>

    <div class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-logo">☢</div>

        <h2>Welcome to Uranium AI</h2>

        <p>Ask questions, get help, and explore ideas.</p>

        <div class="suggestions">

          <div class="suggestion"
            onclick="useSuggestion('Explain how black holes work')">
            🌌 Explain how black holes work
          </div>

          <div class="suggestion"
            onclick="useSuggestion('Help me write some HTML')">
            💻 Help me write some HTML
          </div>

          <div class="suggestion"
            onclick="useSuggestion('Give me a cool game idea')">
            🎮 Give me a game idea
          </div>

          <div class="suggestion"
            onclick="useSuggestion('What can you do?')">
            ☢ What can you do?
          </div>

        </div>

      </div>

    </div>

    <div class="input-section">

      <div class="input-box">

        <textarea
          id="userInput"
          placeholder="Message Uranium AI..."
          rows="1"></textarea>

        <div class="input-controls">
          <button
            class="send"
            id="sendBtn"
            onclick="sendMessage()">
            ↑
          </button>
        </div>

      </div>

      <div class="disclaimer">
        Uranium AI can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>

const API_URL = "https://studytoolsss.b-cdn.net/v1/chat/gpt-oss";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const history = document.getElementById("history");

let messages = [
  {
    role: "system",
    content: "You are Uranium AI, a helpful, friendly, and clear AI assistant."
  }
];

function addMessage(content, role) {

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const row = document.createElement("div");
  row.className = "message-row";

  const avatar = document.createElement("div");

  avatar.className =
    "avatar " +
    (role === "user" ? "user-avatar" : "ai-avatar");

  avatar.textContent =
    role === "user" ? "👤" : "☢";

  const wrapper = document.createElement("div");

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent =
    role === "user" ? "You" : "Uranium AI";

  const text = document.createElement("div");
  text.className = "message-content";
  text.textContent = content;

  wrapper.appendChild(name);
  wrapper.appendChild(text);

  row.appendChild(avatar);
  row.appendChild(wrapper);

  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {

  const row = document.createElement("div");

  row.className = "message-row";
  row.id = "typingRow";

  row.innerHTML = `
    <div class="avatar ai-avatar">☢</div>
    <div>
      <div class="message-name">Uranium AI</div>
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const typing = document.getElementById("typingRow");
  if (typing) typing.remove();
}

async function askAI(userText) {

  messages.push({
    role: "user",
    content: userText
  });

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    if (!response.ok) {
      const errorText = await response.text();

      throw new Error(
        `Error ${response.status}: ${errorText.substring(0, 200)}`
      );
    }

    const data = await response.json();

    const reply =
      data.response?.choices?.[0]?.message?.content ||
      data.choices?.[0]?.message?.content ||
      data.response?.message?.content ||
      data.message?.content ||
      data.response ||
      data.message ||
      "No reply received.";

    messages.push({
      role: "assistant",
      content: reply
    });

    return reply;

  } catch (error) {

    console.error(error);

    return "⚠️ Uranium AI error:\n\n" + error.message;
  }
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  addHistory(text);

  input.value = "";
  input.style.height = "auto";

  sendBtn.disabled = true;

  showTyping();

  const reply = await askAI(text);

  hideTyping();

  addMessage(String(reply), "assistant");

  sendBtn.disabled = false;

  input.focus();
}

function newChat() {

  messages = [
    {
      role: "system",
      content: "You are Uranium AI, a helpful, friendly, and clear AI assistant."
    }
  ];

  chat.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="welcome-logo">☢</div>

      <h2>Welcome to Uranium AI</h2>

      <p>Ask questions, get help, and explore ideas.</p>

      <div class="suggestions">

        <div class="suggestion"
          onclick="useSuggestion('Explain how black holes work')">
          🌌 Explain how black holes work
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Help me write some HTML')">
          💻 Help me write some HTML
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Give me a cool game idea')">
          🎮 Give me a game idea
        </div>

        <div class="suggestion"
          onclick="useSuggestion('What can you do?')">
          ☢ What can you do?
        </div>

      </div>

    </div>
  `;

  input.focus();
}

function addHistory(text) {

  if (!text) return;

  const item = document.createElement("div");

  item.className = "history-item";

  item.textContent = text.substring(0, 45);

  history.prepend(item);
}

function useSuggestion(text) {
  input.value = text;
  sendMessage();
}

input.addEventListener("input", () => {

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight, 180) + "px";

});

input.addEventListener("keydown", event => {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {
    event.preventDefault();
    sendMessage();
  }

});

input.focus();

</script>

</body>
</html>
